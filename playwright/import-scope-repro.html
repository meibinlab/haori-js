<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>data-import のスコープ継承</title>
  <script src="/dist/haori.iife.js"></script>
</head>
<body>
  <!-- 1. 祖先の data-bind を継承する -->
  <div id="host" data-bind='{"currentStep":2,"user":{"name":"テスト太郎"}}'>
    <p id="direct">直書き: {{currentStep}} / {{user.name}}</p>
    <div id="imported" data-import="/playwright/import-scope-fragment.html"></div>
  </div>

  <!-- 2. 取り込み先要素自身の data-bind を参照する -->
  <div id="imported2"
       data-bind='{"currentStep":3,"user":{"name":"取り込み先で宣言"}}'
       data-import="/playwright/import-scope-fragment.html"></div>

  <!-- 2.5 取り込み後のバインド更新が断片へ届く -->
  <button id="next-step" type="button"
    data-click-data='{"currentStep":3}'
    data-click-bind="#host"
    data-click-bind-merge>
    次のステップへ
  </button>

  <!-- 3. 初期化後に URL が確定する取り込み（読み込み時点では未実行） -->
  <div id="host3" data-bind='{"currentStep":2,"user":{"name":"あとから"}}'>
    <div id="imported3" data-import="{{url}}"></div>
  </div>
  <button id="load-late" type="button"
    data-click-data='{"url":"/playwright/import-scope-fragment.html"}'
    data-click-bind="#host3"
    data-click-bind-merge>
    あとから読み込む
  </button>
</body>
</html>
