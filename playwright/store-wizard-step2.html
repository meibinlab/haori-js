<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>data-store ウィザード（2画面目）</title>
  </head>
  <body>
    <h2>2画面目: 確認と契約</h2>

    <div
      id="restored"
      data-bind='{"customer":{},"receipt":{},"contracts":[]}'
      data-store="wizardApply"
      data-store-params="customer&amp;receipt&amp;contracts"
    >
      <span id="name">{{customer.name}}</span>
      <span id="kind">{{customer.kind}}</span>
      <span id="receiptNo">{{receipt.no}}</span>
      <p id="agreedMessage" data-if="customer.agreed">同意済み</p>
      <div id="list" data-each="contracts"><span class="row">{{no}}</span></div>
    </div>

    <button
      id="addContract"
      data-click-data='{"contracts":[{"no":"C-1"}]}'
      data-click-bind="#restored"
      data-click-bind-merge
    >
      契約追加
    </button>

    <button id="back" data-click-redirect="/playwright/store-wizard-step1.html">
      戻る
    </button>

    <button id="done" data-click-store-clear="wizardApply">完了</button>

    <script src="/dist/haori.iife.js"></script>
  </body>
</html>
