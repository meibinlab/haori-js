<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>画面外の入力欄で検証 UI が出ない問題の回帰確認</title>
    <style>
      /* この不具合はビューポートのスクロールが smooth のときだけ起きる */
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        font-family: sans-serif;
      }
      .spacer {
        height: 2500px;
        background: linear-gradient(#eef, #fee);
      }
    </style>
  </head>
  <body>
    <!--
      修正前は reportValidity() を先に呼び、その後でスクロールしていた。バブルは
      画面外の位置に固定されたまま要求されるため、ブラウザがアンカーを見失って
      表示を取り消し、メッセージが出なかった。ネイティブの検証 UI とスムーズ
      スクロールの進み方は実ブラウザでしか確認できないため、実際に操作して
      「reportValidity が呼ばれた時点で入力欄が画面内にあるか」を測る。
    -->
    <form id="f">
      <p>先頭の必須欄（ボタンからは画面外になる）</p>
      <input id="x" name="x" required placeholder="必須" />
    </form>
    <div class="spacer">spacer</div>
    <button
      id="validate"
      data-click-validate
      data-click-form="#f"
      data-click-scroll-error
    >
      検証
    </button>
    <div class="spacer">spacer2</div>

    <script src="/dist/haori.iife.js"></script>
    <script>
      // reportValidity が呼ばれた瞬間の入力欄の位置を記録する（バブルはこの位置へ
      // 固定されるため、画面外なら表示されない）。
      window.__reports = [];
      window.__scrolls = [];
      const original = HTMLInputElement.prototype.reportValidity;
      HTMLInputElement.prototype.reportValidity = function () {
        const rect = this.getBoundingClientRect();
        window.__reports.push({
          id: this.id,
          top: Math.round(rect.top),
          bottom: Math.round(rect.bottom),
          innerHeight: window.innerHeight,
          scrolls: window.__scrolls.length,
        });
        return original.call(this);
      };
      // スクロールの指定（スムーズのままか）も記録する。
      const originalScroll = Element.prototype.scrollIntoView;
      Element.prototype.scrollIntoView = function (options) {
        window.__scrolls.push({
          id: this.id,
          options: options ? JSON.stringify(options) : null,
        });
        return originalScroll.call(this, options);
      };
    </script>
  </body>
</html>
