<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>リセット後に data-each の選択肢が復元されることの回帰確認</title>
  </head>
  <body>
    <!--
      フォームの外側で取得した選択肢を、フォーム内の <select> へ data-each で描く
      構成。data-{event}-reset-before で初期化すると行がすべて消え、以降の再評価が
      「同じ要素データで描画済み」と判定して差分更新を省略するため復元されなかった。
      実ブラウザでは <select> の option 描画と選択状態の扱いが jsdom と異なるため、
      操作して確認する。
    -->
    <div id="opts" data-bind='{"plans":{"content":[]}}'>
      <div
        class="hidden"
        data-fetch="/playwright/reset-each-options.json"
        data-fetch-bind="#opts"
        data-fetch-bind-arg="plans"
      ></div>
      <form id="edit-form" novalidate>
        <label>
          プラン
          <select
            id="plans"
            name="planIds"
            multiple
            data-each="plans.content"
            data-each-key="id"
            data-each-arg="p"
          >
            <option value="{{p.id}}">{{p.planName}}</option>
          </select>
        </label>
        <label>メモ <input id="memo" name="memo" /></label>
      </form>
    </div>

    <p>
      <button
        id="new"
        type="button"
        data-click-reset-before="#edit-form"
        data-click-data='{"memo":"新規"}'
        data-click-bind="#edit-form"
      >
        新規追加
      </button>
      <button id="collect" type="button">収集</button>
    </p>
    <pre id="log">-</pre>

    <script src="/dist/haori.iife.js"></script>
    <script>
      /* global Haori */
      const $ = id => document.getElementById(id);
      const ns = () => (Haori && Haori.default ? Haori : {default: Haori});

      /**
       * 選択肢の描画結果とフォームの収集値を記録します。
       */
      const dump = () => {
        const api = ns();
        const select = $('plans');
        $('log').textContent = JSON.stringify({
          options: Array.from(select.options).map(option => ({
            value: option.value,
            text: option.textContent.trim(),
          })),
          selected: Array.from(select.selectedOptions).map(o => o.value),
          collected: api.Form.getValues(api.Fragment.get($('edit-form'))),
        });
      };

      $('collect').addEventListener('click', async () => {
        await ns().Queue.waitForIdle();
        dump();
      });
    </script>
  </body>
</html>
