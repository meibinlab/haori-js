<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>data-each pagination repro</title>
</head>

<body>
  <h1>data-each pagination repro</h1>
  <p>Haori.js の開発中ソースでページネーション描画を再現する最小ページです。</p>

  <script src="../../dist/haori.iife.js"></script>

  <main
    id="project-list"
    data-bind='{"content":[],"totalPages":0,"number":0,"size":10,"totalElements":0}'
    data-fetch="./data-each-pagination-repro.json"
  >
    <div>
      <table>
        <thead>
          <tr>
            <th>案件名</th>
            <th>単価</th>
            <th>時期</th>
          </tr>
        </thead>
        <tbody data-each="content" data-each-key="id">
          <tr>
            <td>{{projectName}}</td>
            <td>{{unitPrice}}</td>
            <td>{{startPeriod}}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <nav id="pagination-nav" aria-label="ページネーション">
      <!-- 表示要素列は組み込みヘルパー haori.pages() で生成する。
           省略記号の要素は page が null になるため data-each-key は指定しない。 -->
      <ul class="pagination" data-each="haori.pages(totalPages, number, {window: 5, boundary: 1})">
        <li class="page-item {{ellipsis ? 'disabled' : active ? 'active' : ''}}">
          <span data-if="ellipsis" class="page-link" aria-hidden="true">…</span>
          <span data-if="!ellipsis && active" class="page-link" aria-current="page">{{label}}</span>
          <button data-if="!ellipsis && !active" type="button" class="page-link">{{label}}</button>
        </li>
      </ul>
    </nav>
  </main>
</body>

</html>
