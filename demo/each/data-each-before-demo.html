<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>data-each-before デモ</title>
  <style>
    .before { color: green; font-weight: bold; }
    ul { padding-left: 1.5em; }
  </style>
</head>
<body>
  <h2>data-each-before デモ</h2>
  <p>
    data-each-before を付けた要素はテンプレート化されず、生成した行の前に固定表示されます。
    ループコンテナ（data-each を付けた要素）の直接の子として置く必要があります。
  </p>
  <div data-bind='{"items":["りんご", "バナナ", "みかん"]}'>
    <ul data-each="items" data-each-arg="item">
      <li data-each-before class="before">ここはループ前に表示されます</li>
      <li>{{item}}</li>
    </ul>
  </div>
  <script src="../../dist/haori.iife.js"></script>
</body>
</html>
