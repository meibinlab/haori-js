<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>data-click-before-run / after-run デモ</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 20px; }
    #log { background: #eeeeee; padding: 8px; min-height: 1.4em; }
    button { padding: 6px 12px; }
  </style>
</head>
<body>
  <h2>data-click-before-run / after-run デモ</h2>
  <p>
    data-click-before-run は手続きの前に、data-click-after-run は手続きの後に実行されます。
    before-run が false を返すと手続きを中止します（下の「中止する」ボタン）。
    呼ぶ関数は <code>Haori.handlers.register()</code> で登録し、<code>-handler</code> で名前を書きます。
  </p>
  <button
    id="send"
    data-click-fetch="./data-click-before-after-demo.json"
    data-click-before-run-handler="logBeforeSend"
    data-click-after-run-handler="logAfterSend"
    data-click-bind="#result"
  >送信</button>
  <button
    id="cancel"
    data-click-fetch="./data-click-before-after-demo.json"
    data-click-before-run-handler="cancelSend"
    data-click-after-run-handler="logNotCalled"
    data-click-bind="#result"
  >中止する</button>
  <p>実行の記録: <span id="log"></span></p>
  <div id="result">
    <p>結果: {{result ?? '（未取得）'}}</p>
  </div>
  <script src="../../dist/haori.iife.js"></script>
  <script>
    /**
     * 実行の記録へ追記します。
     *
     * @param text 追記する文字列
     */
    function log(text) {
      document.getElementById('log').textContent += text + ' ';
    }

    Haori.handlers.register('logBeforeSend', function () {
      log('送信前');
      return true;
    });
    Haori.handlers.register('logAfterSend', function () {
      log('送信後');
    });
    // false を返すと手続きを中止する。
    Haori.handlers.register('cancelSend', function () {
      log('中止');
      return false;
    });
    Haori.handlers.register('logNotCalled', function () {
      log('（呼ばれません）');
    });
  </script>
</body>
</html>
