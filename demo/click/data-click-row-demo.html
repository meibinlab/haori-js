<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>data-click-row-add/remove/prev/next デモ</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 20px; }
    .row { margin: 4px 0; }
    button { padding: 4px 8px; }
  </style>
</head>
<body>
  <h2>data-click-row デモ</h2>
  <p>
    行の追加・削除・並べ替えのデモです。ボタンは自分が属する行を対象にします。
    行のテンプレートはループコンテナの直接の子 1 つなので、行の中身は 1 つの要素へ
    まとめます（複数並べると最初の要素だけがテンプレートになります）。
  </p>
  <div data-bind='{"items":[{"name":"A"},{"name":"B"}]}' id="list" data-form>
    <div data-each="items" data-each-arg="item" data-form-list="items">
      <div class="row">
        <input name="name" data-attr-value="{{item.name}}">
        <button type="button" data-click-row-add>行追加</button>
        <button type="button" data-click-row-remove>削除</button>
        <button type="button" data-click-row-prev>↑</button>
        <button type="button" data-click-row-next>↓</button>
      </div>
    </div>
  </div>
  <script src="../../dist/haori.iife.js"></script>
</body>
</html>
