<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>data-url-param デモ</title>
    <script src="../../dist/haori.iife.js"></script>
</head>
<body>
  <h2>data-url-param デモ</h2>
  <div>URLパラメータ user を取得して表示します</div>
  <!--
    data-url-arg を指定してクエリを params 配下へマージする。省略すると全置換に
    なり、クエリに含まれないキーの直接参照が未解決参照になるため、有無が不定な
    パラメータはプロパティ参照（{{params.user}}）で扱う。
    URL例: ?user=太郎 で開くと「ユーザー: 太郎」と表示されます。
  -->
  <div data-url-param data-url-arg="params">
    <p>ユーザー: {{params.user}}</p>
  </div>
</body>
</html>
