<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>data-form-list デモ</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 20px; }
    .output { background: #e8f5e9; padding: 10px; border-left: 4px solid #4CAF50; }
    fieldset { margin: 10px 0; }
  </style>
  <script src="../../dist/haori.iife.js"></script>
</head>
<body>
  <h2>data-form-list デモ</h2>
  <p>
    data-form-list を入力要素に付けると値の配列になり、コンテナに付けるとその配下を
    要素とするオブジェクトの配列になります。
  </p>
  <form
    data-form
    data-bind='{"tags":["js","ts"],"items":[{"name":"Item1"},{"name":"Item2"}]}'
  >
    <fieldset>
      <legend>値の配列（tags）</legend>
      <input name="tags" value="js" data-form-list>
      <input name="tags" value="ts" data-form-list>
    </fieldset>
    <fieldset data-form-list="items">
      <legend>オブジェクトの配列（items）</legend>
      <div><input name="name" value="Item1"></div>
      <div><input name="name" value="Item2"></div>
    </fieldset>
    <p class="output" id="output">
      tags: {{tags[0]}}, {{tags[1]}} / items: {{items[0].name}}, {{items[1].name}}
    </p>
  </form>
</body>
</html>
