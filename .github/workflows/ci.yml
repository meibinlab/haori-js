name: CI

on:
  push:
    branches:
      - main
      - develop
      - release/**

  pull_request:
    branches:
      - main
      - develop
      - release/**

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      # jsdom では再現しない描画タイミング由来の不具合（入力欄への書き戻しと
      # data-each の行生成の順序など）を検出するため、実ブラウザのテストも実行する。
      # 配信するのは直前のビルド成果物（`CI` 環境変数で二重ビルドを避ける）。
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e
