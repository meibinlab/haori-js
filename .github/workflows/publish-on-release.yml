name: Publish npm package on GitHub Release

on:
  release:
    types: [published]

permissions:
  contents: read
  # npm の Trusted Publishing（OIDC）で短命の公開トークンを受け取るために必要。
  id-token: write

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.19.0'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted Publishing は npm 11.5.1 以降でのみ利用できる。Node 20.19.0 に
      # 同梱される npm は 10 系なので、公開に使う CLI だけ入れ替える（依存の
      # 導入とビルドは CI と同じ Node で行うため、Node 自体は上げない）。
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Check published version
        id: package-version
        shell: bash
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} is already published. Skipping npm publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.package-version.outputs.already_published != 'true'
        shell: bash
        run: |
          # 認証は npm の Trusted Publishing（OIDC）で行うため、長期トークンは
          # 使わない。パッケージ側に「この repository とこの workflow から公開
          # できる」と登録しておく必要がある。出自証明（provenance）は自動で付く。
          echo "npm $(npm --version)"
          npm publish --access public
